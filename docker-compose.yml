services:
  postgres:
    image: 'postgres:17'
    container_name: salon_db_dev
    environment:
      POSTGRES_DB: salon_de_belleza_db
      POSTGRES_USER: salon_admin
      POSTGRES_PASSWORD: salon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  redis:
    image: 'redis:8.6.2'
    container_name: salon_redis_dev
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data: