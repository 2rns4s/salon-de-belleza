spring.application.name=SalonDeBelleza

api.base-path=/api/v1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.datasource.username=${DB_USERNAME:salon_admin}
spring.datasource.password=${DB_PASSWORD:salon_password}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salon_de_belleza_db?createDatabaseIfNotExist=true}

salon.hora-inicio-servicio=09:00:00
salon.hora-fin-servicio=19:00:00

security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-time=3600000

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

security.mfa.setup-ttl-minutes=5

security.db.encryption.key=${SECURITY_DB_ENCRYPTION_KEY:EstaEsUnaClaveSecretaDe32Bytes!!}

# Twilio SMS Notifications (Configurable vía variables de entorno)
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}
